<ion-header>
    <ion-toolbar>
        <ion-title align="center">Nueva Tarea</ion-title>

        <ion-buttons slot="start">
            <ion-button (click)="deshacerFormularioModal()">Cancelar</ion-button>
        </ion-buttons>
        <ion-buttons slot="end">
            <ion-button (click)="crearTarea()" [strong]="true" [disabled]="miTarea.invalid">Guardar</ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
    <!-- Formulario de añadir tarea -->
    <form [formGroup]="miTarea" (ngSubmit)="crearTarea()">
        <!-- Campos establecidos para el formulario -->
        <ion-item>
            <ion-input formControlName="nombre" maxlength="100">
                <div slot="label">
                    Nombre <span class="asterisco-obligatorio">*</span>
                </div>
            </ion-input>
        </ion-item>

        <ion-item>
            <ion-textarea label="Descripción" formControlName="descripcion" maxLength="500"></ion-textarea>
        </ion-item>

        <ion-item>
            <ion-select formControlName="prioridad">
                <div slot="label">
                    Prioridad <span class="asterisco-obligatorio">*</span>
                </div>
                <ion-select-option value="baja">Baja</ion-select-option>
                <ion-select-option value="media">Media</ion-select-option>
                <ion-select-option value="alta">Alta</ion-select-option>
            </ion-select>
        </ion-item>

        <ion-item>
            <ion-input type="date" label="Fecha inicial" formControlName="fechaLimite" [min]="fechaMinima">
            </ion-input>
        </ion-item>

        <ion-item>
            <ion-select formControlName="categoria">
                <div slot="label">
                    Categoría <span class="asterisco-obligatorio">*</span>
                </div>
                <ion-select-option value="trabajo">Trabajo</ion-select-option>
                <ion-select-option value="estudios">Estudios</ion-select-option>
                <ion-select-option value="personal">Personal</ion-select-option>
                <ion-select-option value="compras">Compras</ion-select-option>
                <ion-select-option value="otros">Otros</ion-select-option>
            </ion-select>
        </ion-item>

        <ion-item>
            <ion-textarea label="Observaciones" formControlName="observaciones" maxlength="500"></ion-textarea>
        </ion-item>

        <div class="ion-padding-top">
            <ion-button expand="block" type="submit" [disabled]="miTarea.invalid">
                Añadir Tarea
            </ion-button>
        </div>
    </form>
</ion-content>
