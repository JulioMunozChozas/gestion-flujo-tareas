<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title align="center">
            Gestión del Flujo de Trabajo
        </ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
    <!--------- Realizamos el paso 3 después de los pasos 1 y 2 --------->

    <ion-item>
        <ion-label position="floating">Escribe nueva tarea:</ion-label>
        <ion-input [(ngModel)]="input" type="text"></ion-input>
    </ion-item>


    <ion-item>
        <ion-button expand="block" (click)="mostrarTareas()">
            Añadir tarea
        </ion-button>
    </ion-item>

    <!-- Aquí es donde visualizamos la lista de Tareas -->
    <ion-list>
        <ion-item *ngFor="let item of listaTareas">
            {{ item }}
        </ion-item>
    </ion-list>

    <app-explore-container name="Lista de tareas"></app-explore-container>
</ion-content>
