<!-- Barra lateral del Menú completo -->
<ion-menu contentId="main-content-doing">
    <ion-header class="ion-no-border">
        <ion-toolbar color="indigo">
            <ion-title>Menú Principal</ion-title>
        </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
        <ion-item>Crear Nueva Tarea</ion-item>
        <ion-item>Limpiar Historial</ion-item>
        <ion-item>Configuración</ion-item>
    </ion-content>
</ion-menu>

<!-- Cabecera del menú -->
<ion-header id="main-content-doing" class="ion-no-border">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-menu-button></ion-menu-button>
        </ion-buttons>
        <ion-title>Gestión Flujo de Tareas</ion-title>
        <ion-buttons slot="end">
            <ion-button>
                <ion-icon slot="icon-only" name="add" color="primary"></ion-icon>
            </ion-button>
        </ion-buttons>
    </ion-toolbar>
</ion-header>


<ion-content [fullscreen]="true" class="ion-padding">
    <ion-header collapse="condense">
        <ion-toolbar>
            <ion-title size="large">Tareas completadas</ion-title>
        </ion-toolbar>
    </ion-header>

    <app-explore-container name="Tareas completadas"></app-explore-container>
</ion-content>
